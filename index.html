<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table,th,td {
            border: 1px solid black;
            border-style: dotted;
        }

      th,td  {
            background-color: #96D4D4;
            border-color: #4106b0;
        }
        th{
            text-align: left;
        }
        table {
            border-spacing: 10px;
        }
        th,td{
            padding-top: 3px;
            padding-bottom: 3px;
            padding-left: 3px;
            padding-right: 3px;
        }

    </style>
</head>
<body>
    <table style="width:100%">
        <thead>
        <tr>
            <th colspan="2">ITEM</th>
            <th>QUANTITY</th>
            <th style="width:70%">PRICE</th>
        </tr>
        </thead>
    <tbody>
        <tr>
            <caption>fruit detail</caption>
            <td>MANGO</td>
            <td>MANGO JUICE</td>
            <td>2</td>
            <td>300</td>
        </tr>
        <tr>
            <td>APPLE</td>
            <td>APPLE JUICE</td>
            <td>5</td>
            
            <td>800</td>
        </tr>
        <tr>
            <td>TOTAL</td>
            <td>JUICE</td>
            <td>7</td>
            <td>1100</td>
        </tr>
    </tbody>
    </table>
</body>
</html>
