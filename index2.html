<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label for="fname">first name:</label><br>
        <input type="text" name="fname"
        placeholder="Enter your full name" required><br>
        <label for="lname">last name:</label><br>
        <input type="text" name="lname"><br>
        <input type="submit" value="submit"><br>
        <p> choose your favorite language:</p>
        <input type="radio" name="language">
        <label for="language">HTML</label><br>
        <input type="radio" name="language">
        <label for="language">CSS</label><br>
        <input type="radio" name="language">
        <label for="language">JAVA</label><br>
        <p>choose your vehicles:</p>
        <input type="checkbox" name="vehicle">
        <label for="vehicle">bike</label><br>
        <input type="checkbox" name="vehicle">
        <label for="vehicle">car</label><br>
        <p>choose a car:</p><br>
        <label for="cars">choose a car:</label>
        <select name="cars">
            <option value="volvo">volvo</option>
            <option  value= "g wagon" selected>G-wagon</option>
            <option value="audi">audi</option>     
        </select><br>
        <p>write about yourself:</p>
        <textarea name="message" rows="10" cols="30"></textarea><br>
        <input type="submit"><br>
        <button type="button" onclick="alert('hello world!')"> click me!</button><br>
        <label for="photo">add your photo:</label>
        <input type="file" name="photo">
    </form>
</body>
</html>
